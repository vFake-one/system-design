{% extends "base.html" %}
{% block title %}Users{% endblock %}
{% block content %}
<div class="d-flex justify-content-between mb-3">
  <h1 class="h3 mb-0">Users</h1>
  <a class="btn btn-teal text-white" href="{{ url_for('admin.user_new') }}">Add user</a>
</div>
<form class="row g-2 mb-3" method="get">
  <div class="col-auto"><input class="form-control" name="q" value="{{ q }}" placeholder="Search"></div>
  <div class="col-auto"><button class="btn btn-outline-secondary">Search</button></div>
</form>
<div class="card">
  <table class="table">
    <thead><tr><th>Name</th><th>Username</th><th>Role</th><th>Active</th><th></th></tr></thead>
    <tbody>
    {% for u in people %}
      <tr>
        <td>{{ u.full_name }}</td>
        <td>{{ u.username }}</td>
        <td>{{ u.role }}</td>
        <td>{{ 'Yes' if u.is_active else 'No' }}</td>
        <td><a href="{{ url_for('admin.user_edit', user_id=u.id) }}">Edit</a></td>
      </tr>
    {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
